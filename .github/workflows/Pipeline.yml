name: Build Solution

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env: 
  DOTNET_VERSION: 9.0.x
  DOTNET_CONFIGURATION: Release
  
  # Testing Variables
  TESTS_VERBOSITY_LEVEL: normal

  #  Transitive Variables
  BUILD_OUTPUT_NAME: build-artifact
  BUILD_OUTPUT_PATH: "**/bin/${{ env.DOTNET_CONFIGURATION }}"

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: ⚙️ Setup .NET ️
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    
    - name: 🔎 Restore dependencies
      run: dotnet restore
    
    - name: 🔨 Build
      run: dotnet build --no-restore --configuration ${{ env.DOTNET_CONFIGURATION }}
    
    - name: ↗️ Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BUILD_OUTPUT_NAME }}
        path: ${{ env.BUILD_OUTPUT_PATH }}

  Tests:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - uses: actions/checkout@v4

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: ↙️ Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BUILD_OUTPUT_NAME }}
          path: ${{ env.BUILD_OUTPUT_PATH }}
      
      - name: 🙏🏽 Run Unit Tests
        run: dotnet test --no-build --configuration ${{ env.DOTNET_CONFIGURATION }} --verbosity ${{ env.TESTS_VERBOSITY_LEVEL }}