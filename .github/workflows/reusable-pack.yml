name: Pack

on:
  workflow_call:
    inputs:
      dotnet-version:
        required: true
        type: string
        default: 9.0.x
        description: Defines the .NET version to be used for pack the projects
      dotnet-configuration:
        required: false
        default: Release
        type: string
        description: Defines the Configuration of the pack command
      verbosity:
        required: false
        type: string
        default: normal
        description: Defines the verbosity level of the pack command
      nuget-packages-output-folder:
        required: false
        default: ./nupkgs
        type: string
      environment:
        required: false
        default: Integration
        type: string
        description: The environment of the running context, this defines the strategies related to version publish and naming

jobs:
  detect-projects:
    name: 🔎 Detect projects to Pack
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: ✅ Set projects matrix
        run: |
          projects=$(find ./src -name '*.csproj' | jq --raw-input --slurp --compact-output 'split("\n") | map(select(length > 0))')
          echo "matrix=$projects" >> $GITHUB_OUTPUT

  pack:
    name: 📦 Pack detected projects
    runs-on: ubuntu-latest
    needs: detect-projects
    strategy:
      matrix:
        project: ${{ fromJson(needs.detect-projects.outputs.matrix) }}
    steps:
      - name: ✓ Deep Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET ️
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: 📦 Pack Project
        shell: bash
        run: |
          VERSION=$(nbgv get-version -p "$(dirname ${{ matrix.project }})" --variable Version)
          dotnet pack ${{ matrix.project }} \
            --configuration ${{ inputs.dotnet-configuration }} \
            --output ${{ inputs.nuget-packages-output-folder }} \
            /p:Version=$VERSION

