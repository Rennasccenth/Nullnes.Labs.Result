name: Publish Entry

on:
  push:
    branches:
      - feature/publish-into-nuget

jobs:
  build:
    name: Build entire solution
    uses: ./.github/workflows/reusable-build.yml
    with:
      dotnet-version: ${{ vars.DOTNET_VERSION }}
      dotnet-configuration: ${{ vars.DOTNET_CONFIGURATION }}
      verbosity: ${{ vars.VERBOSITY_LEVEL }}
      should-include-tests-artifacts: true
      upload-build-artifacts-name: build-artifacts-upload-name
      upload-test-build-artifacts-name: test-artifacts-upload-name

  tests:
    name: Run Unit Tests
    needs: build
    uses: ./.github/workflows/reusable-unit-tests.yml
    with:
      dotnet-version: ${{ vars.DOTNET_VERSION }}
      dotnet-configuration: ${{ vars.DOTNET_CONFIGURATION }}
      verbosity: ${{ vars.VERBOSITY_LEVEL }}
      upload-build-artifacts-name: ${{ needs.build.outputs.upload-build-artifacts-name }}
      upload-test-build-artifacts-name: ${{ needs.build.outputs.upload-test-build-artifacts-name }}

  pack:
    name: Pack projects
    needs: [build, tests]
    uses: ./.github/workflows/reusable-pack.yml
    with:
      dotnet-configuration: ${{ vars.DOTNET_CONFIGURATION }}
      verbosity: ${{ vars.VERBOSITY_LEVEL }}
      upload-build-artifacts-name: ${{ needs.build.outputs.upload-build-artifacts-name }}
      nuget-packages-output-folder: ${{ vars.NUGET_PACKAGES_FOLDER }}
      environment: Integration

