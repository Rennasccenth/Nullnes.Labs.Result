name: Publish Entry

on:
  push:
    branches:
      - feature/publish-into-nuget

jobs:
  build:
    name: 🧱 Build entire solution
    uses: ./.github/workflows/reusable-build.yml
    with:
      dotnet-version: ${{ vars.DOTNET_VERSION }}
      dotnet-configuration: ${{ vars.DOTNET_CONFIGURATION }}
      verbosity: ${{ vars.VERBOSITY_LEVEL }}
      should-include-tests-artifacts: true
      upload-build-artifacts-name: build-artifacts-upload-name
      upload-test-build-artifacts-name: test-artifacts-upload-name

  tests:
    name: 🧪 Tests
    needs: build
    uses: ./.github/workflows/reusable-unit-tests.yml
    with:
      dotnet-version: ${{ vars.DOTNET_VERSION }}
      dotnet-configuration: ${{ vars.DOTNET_CONFIGURATION }}
      verbosity: ${{ vars.VERBOSITY_LEVEL }}
      upload-build-artifacts-name: ${{ needs.build.outputs.upload-build-artifacts-name }}
      upload-test-build-artifacts-name: ${{ needs.build.outputs.upload-test-build-artifacts-name }}

  pack:
    name: 📦 Pack
    needs: [ build, tests ]
    uses: ./.github/workflows/reusable-pack.yml
    with:
      dotnet-version: ${{ vars.DOTNET_VERSION }}
      dotnet-configuration: ${{ vars.DOTNET_CONFIGURATION }}
      verbosity: ${{ vars.VERBOSITY_LEVEL }}
      upload-build-artifacts-name: ${{ needs.build.outputs.upload-build-artifacts-name }}
      nuget-packages-output-folder: ${{ vars.NUGET_PACKAGES_FOLDER }}
      environment: Integration

  push:
    name: 🚀 Push to NuGet Feed
    runs-on: ubuntu-latest
    needs: [build, tests, pack]
    steps:
      - name: ✓ Shallow Checkout
        uses: actions/checkout@v4

      - name: 📦 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.upload-build-artifacts-name }}
          path: ./src

      - name: ⚙️ Setup .NET ️
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION }}

      - name: 🚀 Publish NuGet packages
        run: | 
          dotnet nuget push "${{ vars.NUGET_PACKAGES_FOLDER }}/*.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source ${{ vars.NUGET_SOURCE_URL }} \
            --skip-duplicate